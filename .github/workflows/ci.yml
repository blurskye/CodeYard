name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitserv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitserv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GITSERV_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gitserv_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        # Runner images differ; install the toolchain the project builds with when it is missing.
        run: |
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain 1.97.0 -c rustfmt -c clippy
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the OpenSSH test helper
        run: cargo build --locked -p codeyard --bin codeyard
      - name: Test
        env:
          # The OpenSSH tests run this CLI as a separate process.
          GITSERV_TEST_OPENSSH_HELPER: ${{ github.workspace }}/target/debug/codeyard
        run: cargo test --locked --all-targets
