name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Smaller debug info and no incremental data make the large crate build faster and use less disk.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  test:
    name: Format, lint and test
    runs-on: ubuntu-latest
    # A cold build of the large crate takes more than an hour on a free runner.
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gitserv_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gitserv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure PostgreSQL
        run: |
          if [[ -f /.dockerenv || -f /run/.containerenv ]]; then
            address=postgres:5432
          else
            address=127.0.0.1:${{ job.services.postgres.ports[5432] }}
          fi
          echo "GITSERV_TEST_DATABASE_URL=postgres://postgres:postgres@$address/gitserv_test" >> "$GITHUB_ENV"
      - name: Install Rust
        # The project is checked with one Rust version. Runner images ship a newer one whose Clippy
        # has more lints, so install the pinned version and make it the default.
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
              sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.0 --profile minimal -c rustfmt -c clippy
          rustup default 1.99.0
          rustc --version
      - name: Cache dependencies
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Free disk space
        # The runner was stopped while Clippy checked the large crate, which points to running out
        # of memory. Remove the preinstalled tools this project does not use, to make room for swap
        # and the build. The Docker images stay because the PostgreSQL service container is running,
        # and the tool cache stays because the act build needs the preinstalled Go.
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          docker-images: false
      - name: Add swap
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 20G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -m
          df -h /
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the test helpers
        # The OpenSSH tests run this CLI as a separate process, and the engine tests run the
        # in-house workflow runner.
        run: cargo build --locked -p codeyard -p codeyard-actions --bin codeyard --bin codeyard-actions
      - name: Build the pinned patched act
        # The engine tests need the pinned act version, with the patch that scopes
        # environment values to each job. The tarball must match the pinned SHA-256 digest.
        run: |
          work="$RUNNER_TEMP/act"
          mkdir -p "$work"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$work/act.tar.gz" https://codeload.github.com/nektos/act/tar.gz/refs/tags/v0.2.89
          test "$(openssl dgst -sha256 -binary "$work/act.tar.gz" | base64)" = "ZJzVuRythwhx0ig/s62VyPodXO16HbjXs0bRp9zT7HE="
          tar -xzf "$work/act.tar.gz" -C "$work"
          cd "$work/act-0.2.89"
          patch -p1 < "$GITHUB_WORKSPACE/patches/act-environment-values.patch"
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=0.2.89-codeyard.1" -o "$RUNNER_TEMP/bin/act" .
      - name: Test
        env:
          # The OpenSSH tests run this CLI as a separate process.
          GITSERV_TEST_OPENSSH_HELPER: ${{ github.workspace }}/target/debug/codeyard
          CODEYARD_ACTIONS_BIN: ${{ github.workspace }}/target/debug/codeyard-actions
          E2E_ACT_BINARY: ${{ runner.temp }}/bin/act
        run: cargo test --locked --workspace --all-targets
