
	query PullRequestByNumber($owner: String!, $repo: String!, $pr_number: Int!) {
		repository(owner: $owner, name: $repo) {
			pullRequest(number: $pr_number) {number,headRefName,headRepository{id,name,nameWithOwner},headRepositoryOwner{id,login,...on User{name}},isCrossRepository,maintainerCanModify,id}
		}
	}