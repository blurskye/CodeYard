query RepositoryProjectV2List($endCursor: String, $name: String!, $owner: String!, $query: String!) {
  repository(owner: $owner, name: $name) {
    projectsV2(first: 100, orderBy: {field: TITLE, direction: ASC}, after: $endCursor, query: $query) {
      nodes { id title number resourcePath closed url }
      pageInfo { hasNextPage endCursor }
    }
  }
}
