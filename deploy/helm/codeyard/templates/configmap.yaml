apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "codeyard.fullname" . }}
  labels:
    {{- include "codeyard.labels" . | nindent 4 }}
data:
  PUBLIC_URL: {{ .Values.config.publicUrl | quote }}
  PUBLIC_HTTP_CLONE_BASE: {{ .Values.config.publicHttpCloneBase | quote }}
  PUBLIC_SSH_CLONE_BASE: {{ .Values.config.publicSshCloneBase | quote }}
  COOKIE_DOMAIN: {{ .Values.config.cookieDomain | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  SESSION_DURATION_DAYS: {{ .Values.config.sessionDurationDays | quote }}
  HTTP_TRUSTED_PROXY_IPS: {{ .Values.config.httpTrustedProxyIps | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  CODEYARD_EXPERIMENTAL_CLUSTER: {{ ternary "1" "0" .Values.config.experimentalCluster | quote }}
  STORAGE_MIN_FREE_BYTES: {{ .Values.config.storageMinFreeBytes | quote }}
  S3_ENDPOINT: {{ .Values.config.s3.endpoint | quote }}
  S3_PUBLIC_ENDPOINT: {{ .Values.config.s3.publicEndpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3.bucket | quote }}
  S3_REGION: {{ .Values.config.s3.region | quote }}
