{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "codeyard.fullname" . }}
  labels:
    {{- include "codeyard.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  SECRETS_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
  ADMIN_SECRET: {{ .Values.secrets.adminSecret | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
{{- end }}
