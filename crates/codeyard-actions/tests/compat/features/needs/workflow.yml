# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: compat
on: workflow_dispatch
jobs:
  produce:
    runs-on: ubuntu-latest
    outputs:
      answer: ${{ steps.make.outputs.answer }}
    steps:
      - id: make
        run: echo 'answer=42' >> "$GITHUB_OUTPUT"
  skip:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo compat:must-not-run
  test:
    needs: [produce, skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          ANSWER: ${{ needs.produce.outputs.answer }}
          RESULT: ${{ needs.produce.result }}
          SKIPPED: ${{ needs.skip.result }}
        run: |
          test "$ANSWER/$RESULT/$SKIPPED" = 42/success/skipped
          echo compat:job:skip:skipped
          echo compat:ok
