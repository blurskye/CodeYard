# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstrategyfail-fast
# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/evaluate-expressions-in-workflows-and-actions#status-check-functions
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    name: test-${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        leg: [fail, slow]
    steps:
      - id: main
        run: |
          if [ "${{ matrix.leg }}" = fail ]; then
            sleep 2
            exit 1
          fi
          sleep 60
          echo compat:too-late
      - run: echo "compat:ran-${{ matrix.leg }}"
      - if: failure()
        run: echo "compat:failure-${{ matrix.leg }}"
      - if: cancelled()
        run: echo "compat:cancelled-${{ matrix.leg }}"
      - if: always()
        run: echo "compat:always-${{ matrix.leg }}-${{ job.status }}-${{ steps.main.outcome }}"
