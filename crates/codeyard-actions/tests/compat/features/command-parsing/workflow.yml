# https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'compat:inline ::debug::kept'
          echo '::debug::compat:hidden-debug'
          echo '::echo::on'
          echo '::remove-matcher owner=compat-echoed::'
          echo '::echo::off'
          echo '::remove-matcher owner=compat-quiet::'
          echo compat:done
