# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/docker
        with:
          message: hello
      - run: |
          test "$(cat docker-result.txt)" = hello
          echo compat:ok
