# https://github.com/aws-actions/setup-sam/tree/f84ec7d548307efafe33230528756de3c5841a17
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17 # v2
        with:
          version: "1.134.0"
          use-installer: "true"
      - name: Assert documented effect
        run: |
          sam --version | grep '1\.134\.0'
          echo compat:ok
