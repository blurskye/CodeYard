# https://github.com/gruntwork-io/terragrunt-action/tree/9559e51d05873b0ea467c42bbabcb5c067642ccc
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'terraform {}' > terragrunt.hcl
      - id: action
        uses: gruntwork-io/terragrunt-action@9559e51d05873b0ea467c42bbabcb5c067642ccc # v2
        with:
          tg_version: "0.72.6"
          tofu_version: "1.9.0"
          tg_command: "--version"
      - name: Assert documented effect
        env:
          TG_EXIT: ${{ steps.action.outputs.tg_action_exit_code }}
          TG_OUTPUT: ${{ steps.action.outputs.tg_action_output }}
        run: |
          test "$TG_EXIT" = 0; printf '%s' "$TG_OUTPUT" | grep 'v0.72.6'
          echo compat:ok
