# https://github.com/dcarbone/install-yq-action/tree/4075b4dca348d74bd83f2bf82d30f25d7c54539b
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: dcarbone/install-yq-action@4075b4dca348d74bd83f2bf82d30f25d7c54539b # v1
        with:
          version: "v4.45.1"
      - name: Assert documented effect
        run: |
          yq --version | grep 'v4\.45\.1'
          echo compat:ok
