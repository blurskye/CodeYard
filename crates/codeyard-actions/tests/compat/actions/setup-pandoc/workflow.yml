# https://github.com/pandoc/actions/tree/86321b6dd4675f5014c611e05088e10d4939e09e
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1
        with:
          version: "3.6.3"
      - name: Assert documented effect
        run: |
          pandoc --version | grep 'pandoc 3\.6\.3'
          echo compat:ok
