# https://github.com/bazel-contrib/setup-bazel/tree/e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: bazel-contrib/setup-bazel@e8776f58fb6a6e9055cbaf1b38c52ccc5247e9c4 # 0.14.0
        with:
          bazelisk-cache: "false"
          disk-cache: "false"
          repository-cache: "false"
      - name: Assert documented effect
        run: |
          bazel version
          echo compat:ok
