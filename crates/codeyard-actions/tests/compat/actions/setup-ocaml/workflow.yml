# https://github.com/ocaml/setup-ocaml/tree/93303b622b2522e4411e295f9e77411a24912ac7
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3
        with:
          ocaml-compiler: "5.2.1"
      - name: Assert documented effect
        run: |
          opam exec -- ocamlc -version | grep '^5\.2\.1'
          echo compat:ok
