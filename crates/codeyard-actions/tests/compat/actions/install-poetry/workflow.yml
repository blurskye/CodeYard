# https://github.com/abatilo/actions-poetry/tree/fd0e6716a0de25ef6ade151b8b53190b0376acfd
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: action
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd # v3
        with:
          poetry-version: "1.8.5"
      - name: Assert documented effect
        run: |
          poetry --version | grep '1\.8\.5'
          echo compat:ok
