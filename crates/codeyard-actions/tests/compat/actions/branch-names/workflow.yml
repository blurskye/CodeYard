# https://github.com/tj-actions/branch-names/tree/dde14ac574a8b9b1cedc59a1cf312788af43d8d8
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: tj-actions/branch-names@dde14ac574a8b9b1cedc59a1cf312788af43d8d8 # v8
      - name: Assert documented effect
        env:
          CURRENT_BRANCH: ${{ steps.action.outputs.current_branch }}
        run: |
          test "$CURRENT_BRANCH" = main
          echo compat:ok
