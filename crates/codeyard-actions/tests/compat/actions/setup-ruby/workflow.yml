# https://github.com/ruby/setup-ruby/tree/e1bd6146574da5e0795075b5319b300edb30c5b0
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: ruby/setup-ruby@e1bd6146574da5e0795075b5319b300edb30c5b0 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: "false"
      - name: Assert documented effect
        run: |
          ruby --version | grep '^ruby 3\.3\.'
          echo compat:ok
