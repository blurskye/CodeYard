# https://github.com/BSFishy/meson-build/tree/656b2a360964b249ac82905a52018921e01d875b
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          echo "project('compat')" > meson.build
      - id: action
        uses: BSFishy/meson-build@656b2a360964b249ac82905a52018921e01d875b # v1.0.3
        with:
          action: "setup"
          meson-version: "1.7.0"
      - name: Assert documented effect
        run: |
          test -f build/meson-info/intro-projectinfo.json
          echo compat:ok
