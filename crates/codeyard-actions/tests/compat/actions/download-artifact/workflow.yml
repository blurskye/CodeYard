# https://github.com/actions/download-artifact/tree/d3f86a106a0bac45b974a628896c90dbdf5c8093
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo payload > artifact.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compat-download
          path: artifact.txt
      - id: action
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: "compat-download"
          path: "downloaded"
      - name: Assert documented effect
        run: |
          test "$(cat downloaded/artifact.txt)" = payload
          echo compat:ok
