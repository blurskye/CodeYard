# https://github.com/imranismail/setup-kustomize/tree/2ba527d4d055ab63514ba50a99456fc35684947f
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f # v2
        with:
          kustomize-version: "5.6.0"
      - name: Assert documented effect
        run: |
          kustomize version | grep '5\.6\.0'
          echo compat:ok
