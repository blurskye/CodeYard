# https://github.com/digitalocean/action-doctl/tree/3cb3953159719656269e044e0e24ca16dd2a690f
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2
        with:
          token: "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}"
          version: "1.122.0"
      - name: Assert documented effect
        run: |
          doctl version
          echo compat:ok
