# https://github.com/juliangruber/read-file-action/tree/271ff311a4947af354c6abcd696a306553b9ec18
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          printf 'compat input' > input.txt
      - id: action
        uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1
        with:
          path: "input.txt"
      - name: Assert documented effect
        env:
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          test "$CONTENT" = 'compat input'
          echo compat:ok
