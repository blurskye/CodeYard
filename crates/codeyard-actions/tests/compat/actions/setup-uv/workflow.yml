# https://github.com/astral-sh/setup-uv/tree/d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.6.0"
          enable-cache: "false"
      - name: Assert documented effect
        run: |
          uv --version | grep '^uv 0\.6\.0'
          echo compat:ok
