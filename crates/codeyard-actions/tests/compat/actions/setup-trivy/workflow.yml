# https://github.com/aquasecurity/setup-trivy/tree/3fb12ec12f41e471780db15c232d5dd185dcb514
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: "v0.59.1"
          cache: "false"
      - name: Assert documented effect
        run: |
          trivy --version | grep '0\.59\.1'
          echo compat:ok
