# https://github.com/cachix/install-nix-action/tree/448cde739abec1eaf0646249e3d25bb8d9bc7702
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - name: Assert documented effect
        run: |
          nix --version
          echo compat:ok
