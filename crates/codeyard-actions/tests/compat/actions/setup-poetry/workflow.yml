# https://github.com/snok/install-poetry/tree/a783c322200f0519c7926aa6faa857c4e23e9263
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: action
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: "1.8.5"
      - name: Assert documented effect
        run: |
          poetry --version | grep '1\.8\.5'
          echo compat:ok
