# https://github.com/sbt/setup-sbt/tree/ecad189dd245444b9ae0a0cd5922fd938b88906f
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - id: action
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - name: Assert documented effect
        run: |
          sbt --script-version
          echo compat:ok
