# https://github.com/denoland/setup-deno/tree/22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: "v2.1.0"
      - name: Assert documented effect
        run: |
          deno --version | grep '^deno 2\.1\.0'
          echo compat:ok
