# https://github.com/actions/setup-go/tree/40f1582b2485089dde7abd97c1529aa768e1baff
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.23"
          cache: "false"
      - name: Assert documented effect
        run: |
          go version | grep 'go1\.23\.'
          touch compat.go
          echo 'compat.go:3:4: matcher diagnostic'
          echo compat:ok
