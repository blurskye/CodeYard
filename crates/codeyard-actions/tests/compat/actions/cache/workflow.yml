# https://github.com/actions/cache/tree/0057852bfaa89a56745cba8c7296529d2fc39830
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir cache-data; echo payload > cache-data/data.txt
      - id: action
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: "cache-data"
          key: "compat-${{ env.COMPAT_CACHE_KEY }}"
      - name: Assert documented effect
        env:
          HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          test -d cache-data; test "$HIT" = '' -o "$HIT" = true -o "$HIT" = false
          echo compat:ok
