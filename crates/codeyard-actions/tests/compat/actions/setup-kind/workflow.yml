# https://github.com/engineerd/setup-kind/tree/ecfad61750951586a9ef973db567df1d28671bdc
name: compat
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: engineerd/setup-kind@ecfad61750951586a9ef973db567df1d28671bdc # v0.6.2
        with:
          version: "v0.26.0"
          skipClusterCreation: "true"
      - name: Assert documented effect
        run: |
          kind version | grep 'v0\.26\.0'
          echo compat:ok
