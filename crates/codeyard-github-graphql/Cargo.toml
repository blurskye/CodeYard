[package]
name = "codeyard-github-graphql"
version.workspace = true
edition.workspace = true
license = "LGPL-3.0-or-later"
description = "GitHub GraphQL types and resolver traits derived from the published schema"

# The generated types carry GitHub's schema descriptions as doc comments, and their JSON
# examples are not Rust, so rustdoc must not compile them.
[lib]
doctest = false

[dependencies]
async-graphql.workspace = true
async-graphql-derive.workspace = true
async-graphql-parser.workspace = true
async-graphql-value.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true
