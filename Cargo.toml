[package]
name = "codeyard"
version.workspace = true
edition.workspace = true
description = "Codeyard: self-hosted Git hosting with native Rust and Dioxus SSR-first hydration"
homepage = "https://codeyard.run"
repository = "https://github.com/blurskye/CodeYard"
license = "LGPL-3.0-or-later"

[[bin]]
name = "codeyard"
path = "src/main.rs"

[features]
default = ["server"]
server = []
web = ["dep:dioxus-web", "dep:gloo-net", "dep:gloo-timers", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

# Safe presentation models and pure rendering only; these compile for both targets.
[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-router = "=0.7.10"
dioxus-history = "=0.7.10"
serde.workspace = true
serde_json.workspace = true
url = "2"
futures-util = "0.3.31"
chrono.workspace = true
uuid = { version = "1", default-features = false, features = ["serde"] }
bytes.workspace = true
tracing.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Parser only: the HTML emitter is ours (raw HTML must never render), so no `html` feature.
pulldown-cmark = { version = "=0.13.4", default-features = false }
# The parser matches footnote labels with Unicode case folding; the emitter must too.
unicase = "2"

# No SQLx, SSH, Git, AWS, credentials or server crypto in the browser graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-ssr = "=0.7.10"
dioxus-fullstack-core = { version = "=0.7.10", default-features = false }
subtle = "2.6"
argon2 = { version = "=0.5.3", features = ["std"] }
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
# The TLS provider iroh already uses (aws-lc-rs), so node connections over TCP share it.
tokio-rustls = "0.26"
# TCP keepalive on node connections; tokio does not expose the socket option.
socket2 = "0.6"
futures.workspace = true
flate2 = "1"
axum.workspace = true
tower-http.workspace = true
sqlx.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid.workspace = true
git2.workspace = true
russh.workspace = true
ssh-key.workspace = true
aws-sdk-s3.workspace = true
base64 = "0.22"
# Authenticator-app codes (RFC 6238 TOTP) and their base32 secrets; both versions are already in the lock.
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
dirs = "6"
dotenvy = "0.15"
rand = "0.8"
rand_core = "0.6"
aes-gcm = "0.10"
aws-credential-types = "1"
aws-smithy-types = "1"
tempfile = "3"
libc = "0.2"
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde_yaml = "0.9"
# Node-to-node transport (QUIC, peers authenticated by their keys). Pinned exactly: the
# newest release that was two weeks old when added. aws-lc-rs is the TLS provider the rest
# of the graph uses, so rustls keeps one process-wide default. No portmapper or DNS lookup.
iroh = { version = "=1.2.0", default-features = false, features = ["tls-aws-lc-rs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-web = { version = "=0.7.10", default-features = false, features = ["hydrate", "document", "mounted"], optional = true }
gloo-net = { version = "0.6", default-features = false, features = ["http", "websocket", "json"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Document", "Element", "Node", "Location", "History", "Navigator", "Clipboard", "Request", "RequestInit", "Headers", "RequestCredentials", "AbortController", "AbortSignal", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlDialogElement", "HtmlFormElement", "KeyboardEvent", "NodeList", "Storage", "console", "Event", "EventInit", "EventTarget", "DataTransfer", "DataTransferItemList", "DomRect", "File", "FileList"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit", "compression-gzip", "compression-br"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "regexp", "migrate", "chrono", "uuid"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
git2 = "0.19"
russh = "0.63"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "std"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
