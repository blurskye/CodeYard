[package]
name = "codeyard"
version.workspace = true
edition.workspace = true
description = "Codeyard: self-hosted Git hosting with native Rust and Dioxus SSR-first hydration"
homepage = "https://codeyard.run"
repository = "https://github.com/blurskye/CodeYard"
license = "LGPL-3.0-or-later"

[lib]
path = "backend/app/wiring/lib.rs"

[[bin]]
name = "codeyard"
path = "backend/app/wiring/main.rs"

[features]
web = ["codeyard-webui/web"]

# Shared views and helpers compile for both targets.
[dependencies]
codeyard-webui.workspace = true
codeyard-security.workspace = true
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
url.workspace = true
futures-util.workspace = true
chrono.workspace = true
uuid.workspace = true
bytes.workspace = true
tracing.workspace = true
sha2.workspace = true

# No SQLx, SSH, Git, AWS, credentials or server crypto in the browser graph.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
codeyard-repos-rpc.workspace = true
codeyard-placement.workspace = true
codeyard-repos-pulls.workspace = true
codeyard-git-storage.workspace = true
codeyard-webhooks.workspace = true
codeyard-nodes.workspace = true
codeyard-ci.workspace = true
codeyard-repos.workspace = true
codeyard-storage.workspace = true
codeyard-ssh.workspace = true
async-graphql.workspace = true
async-graphql-parser.workspace = true
codeyard-runner.workspace = true
codeyard-git.workspace = true
codeyard-database.workspace = true
codeyard-db-directory.workspace = true
codeyard-router.workspace = true
codeyard-api-rest.workspace = true
codeyard-api-http.workspace = true
codeyard-app.workspace = true
codeyard-notifications.workspace = true
codeyard-identity.workspace = true
codeyard-db-placement.workspace = true
codeyard-db-security.workspace = true
codeyard-db-actions.workspace = true
codeyard-db-repos.workspace = true
codeyard-db-orgs.workspace = true
codeyard-db-identity.workspace = true
dioxus-ssr.workspace = true
argon2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Classifies body length-limit errors from axum::body::to_bytes.
http-body-util.workspace = true
# The TLS provider iroh already uses (aws-lc-rs), so node connections over TCP share it.
tokio-rustls.workspace = true
flate2.workspace = true
tar.workspace = true
zip.workspace = true
md-5.workspace = true
axum.workspace = true
sqlx.workspace = true
hex.workspace = true
anyhow.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
uuid = { workspace = true, default-features = true, features = ["v4"] }
git2.workspace = true
russh.workspace = true
ssh-key.workspace = true
pgp.workspace = true
aws-sdk-s3.workspace = true
base64.workspace = true
# Authenticator-app codes (RFC 6238 TOTP) and their base32 secrets; both versions are already in the lock.
hmac.workspace = true
sha1.workspace = true
data-encoding.workspace = true
dotenvy.workspace = true
rand.workspace = true
crypto_box.workspace = true
aws-smithy-types.workspace = true
tempfile.workspace = true
libc.workspace = true
reqwest.workspace = true
# Node-to-node transport (QUIC, peers authenticated by their keys). Pinned exactly: the
# newest release that was two weeks old when added. aws-lc-rs is the TLS provider the rest
# of the graph uses, so rustls keeps one process-wide default. No portmapper or DNS lookup.
iroh.workspace = true
rsa.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
jsonschema.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }

[lints]
workspace = true

# The application binds the full generated schema; its debug graph is similarly large.
[profile.dev.package.codeyard]
debug = false

[profile.test.package.codeyard]
debug = false

[profile.dev.package.codeyard-github-graphql]
debug = false

[profile.test.package.codeyard-github-graphql]
debug = false

[workspace]
resolver = "2"
members = ["backend/cache", "backend/router", "backend/repos-rpc", "backend/webhooks", "backend/placement", "backend/nodes", "backend/ci", "backend/repos", "backend/storage", "backend/ssh", "backend/testing", "backend/api/rest", "backend/api/graphql", "backend/api/repos", "backend/api/github", "backend/api/http", "backend/app",
    "backend/git-storage", "backend/repos-pulls", "backend/search", "backend/notifications", "backend/identity", "backend/api/github-graphql", "backend/runner", "backend/db/actions", "backend/db/placement", "backend/db/directory", "backend/database", "backend/db/identity", "backend/db/orgs", "backend/db/repos", "backend/db/security", "backend/git", "backend/security", "backend/types", "webui"]
default-members = [".", "backend/router", "backend/api/github-graphql", "backend/runner", "backend/db/actions", "backend/db/placement", "backend/db/directory", "backend/database", "backend/db/identity", "backend/db/orgs", "backend/db/repos", "backend/db/security", "backend/git", "backend/security", "backend/types", "webui"]

[workspace.package]
version = "0.1.5"
edition = "2021"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
codeyard-repos-pulls = { path = "backend/repos-pulls" }
codeyard-repos-rpc = { path = "backend/repos-rpc" }
codeyard-git-storage = { path = "backend/git-storage" }
codeyard-webhooks = { path = "backend/webhooks" }
codeyard-nodes = { path = "backend/nodes" }
codeyard-placement = { path = "backend/placement" }
codeyard-ci = { path = "backend/ci" }
codeyard-repos = { path = "backend/repos" }
codeyard-storage = { path = "backend/storage" }
codeyard-ssh = { path = "backend/ssh" }
codeyard-testing = { path = "backend/testing" }
codeyard-api-rest = { path = "backend/api/rest" }
codeyard-api-graphql = { path = "backend/api/graphql" }
codeyard-api-repos = { path = "backend/api/repos" }
codeyard-api-github = { path = "backend/api/github" }
codeyard-api-http = { path = "backend/api/http" }
codeyard-app = { path = "backend/app" }
codeyard-cache = { path = "backend/cache" }
codeyard-notifications = { path = "backend/notifications" }
codeyard-identity = { path = "backend/identity" }
codeyard-db-placement = { path = "backend/db/placement" }
codeyard-db-directory = { path = "backend/db/directory" }
codeyard-router = { path = "backend/router" }
codeyard-db-security = { path = "backend/db/security" }
codeyard-db-actions = { path = "backend/db/actions" }
codeyard-db-repos = { path = "backend/db/repos" }
codeyard-db-orgs = { path = "backend/db/orgs" }
codeyard-db-identity = { path = "backend/db/identity" }
codeyard-runner = { path = "backend/runner" }
codeyard-github-graphql = { path = "backend/api/github-graphql" }
codeyard-database = { path = "backend/database" }
codeyard-search = { path = "backend/search" }
codeyard-security = { path = "backend/security" }
codeyard-types = { path = "backend/types" }
codeyard-git = { path = "backend/git" }
codeyard-webui = { path = "webui" }
tokio = { version = "1", features = ["full"] }
http = "1"
axum = { version = "0.7", features = ["macros", "ws", "multipart"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit", "compression-gzip", "compression-br"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "sqlite", "regexp", "migrate", "chrono", "uuid"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"
git2 = "0.19"
libgit2-sys = "0.17"
russh = "0.63"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "std", "p256", "p384", "p521"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-history = "=0.7.10"
dioxus-router = "=0.7.10"
dioxus-fullstack-core = { version = "=0.7.10", default-features = false }
dioxus-ssr = "=0.7.10"
dioxus-web = { version = "=0.7.10", default-features = false, features = ["hydrate", "document", "mounted"] }
futures-util = { version = "0.3.31", features = ["sink"] }
# Parser only: the HTML emitter is ours (raw HTML must never render), so no `html` feature.
pulldown-cmark = { version = "=0.13.5", default-features = false }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# The parser matches footnote labels with Unicode case folding; the emitter must too.
unicase = "2"
unicode-normalization = "0.1.25"
url = "2"
gloo-net = { version = "0.7", default-features = false, features = ["http", "websocket", "json"] }
gloo-timers = { version = "0.4", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "ScrollRestoration", "Element", "Node", "Location", "History", "Navigator", "Performance", "Clipboard", "Request", "RequestInit", "Headers", "RequestCredentials", "AbortController", "AbortSignal", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlDialogElement", "ReadableStream", "ReadableStreamDefaultReader", "HtmlFormElement", "HtmlDocument", "KeyboardEvent", "NodeList", "console", "Event", "EventInit", "EventTarget", "DataTransfer", "DataTransferItemList", "DomRect", "File", "FileList"] }
async-graphql = { version = "=7.2.1", default-features = false }
async-graphql-derive = "=7.2.1"
async-graphql-parser = "=7.2.1"
async-graphql-value = "=7.2.1"
subtle = "2.6"
argon2 = { version = "=0.5.3", features = ["std"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
http-body-util = "0.1"
http-body = "1"
matchit = "0.7"
percent-encoding = "2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-rustls = "0.26"
socket2 = { version = "0.6", features = ["all"] }
flate2 = "1"
tar = "=0.4.46"
zip = { version = "=9.1.1", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
regex = "=1.13.1"
md-5 = "0.10"
pgp = { version = "0.21", default-features = false }
base64 = "=0.23.1"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
encoding_rs = "0.8"
dotenvy = "=0.15.7"
rand = "0.8"
aes-gcm = "0.10"
crypto_box = { version = "0.9.1", features = ["seal"] }
aws-credential-types = "1"
aws-smithy-types = "1"
tempfile = "3"
libc = "0.2"
reqwest = { version = "0.13.5", features = ["json", "query"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
serde_yaml = "0.9"
toml = "0.9"
semver = "1"
croner = "4"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-aws-lc-rs"] }
rsa = { version = "=0.9.10", features = ["sha2", "pem"] }
tower = { version = "0.5", features = ["util"] }
jsonschema = { version = "=0.60.1", default-features = false }
aho-corasick = "=1.1.5"
fancy-regex = "=0.20.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.codeyard-types]
workspace = true
