# https://github.com/pnpm/action-setup/tree/b906affcce14559ad1aafd4ab0e942779e9f58b1
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "9"
          run_install: "false"
      - name: Assert documented effect
        run: |
          pnpm --version | grep '^9\.'
          echo compat:ok
