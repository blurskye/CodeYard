# https://github.com/r-lib/actions/tree/f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Assert documented effect
        run: |
          pdflatex --version
          echo compat:ok
