# https://github.com/leafo/gh-actions-lua/tree/8aace3457a2fcf3f3c4e9007ecc6b869ff6d74d6
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: leafo/gh-actions-lua@8aace3457a2fcf3f3c4e9007ecc6b869ff6d74d6 # v11
        with:
          luaVersion: "5.4.7"
      - name: Assert documented effect
        run: |
          lua -v 2>&1 | grep 'Lua 5\.4\.7'
          echo compat:ok
