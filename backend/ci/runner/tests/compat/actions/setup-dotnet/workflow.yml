# https://github.com/actions/setup-dotnet/tree/67a3573c9a986a3f9c594539f4ab511d57bb3ce9
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Assert documented effect
        run: |
          dotnet --version | grep '^8\.'
          echo compat:ok
