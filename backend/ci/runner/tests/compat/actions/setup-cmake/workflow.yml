# https://github.com/jwlawson/actions-setup-cmake/tree/0d6a7d60b009d01c9e7523be22153ff8f19460d3
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: "3.31.5"
      - name: Assert documented effect
        run: |
          cmake --version | grep '3\.31\.5'
          echo compat:ok
