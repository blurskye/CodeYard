# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: |
          sleep 65
          echo compat:too-late
      - run: echo compat:skipped-after-timeout
      - if: always()
        run: echo "compat:cleanup-${{ job.status }}"
