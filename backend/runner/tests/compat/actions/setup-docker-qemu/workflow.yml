# https://github.com/docker/setup-qemu-action/tree/c7c53464625b32c7a7e944ae62b3e17d2b600130
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: "arm64"
      - name: Assert documented effect
        run: |
          docker run --rm --platform linux/arm64 alpine:3.21 uname -m | grep '^aarch64$'
          echo compat:ok
