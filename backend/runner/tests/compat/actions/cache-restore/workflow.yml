# https://github.com/actions/cache/tree/0057852bfaa89a56745cba8c7296529d2fc39830
name: compat
on:
  workflow_dispatch:
    inputs:
      message:
        description: The input every compatibility run sends
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - id: action
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: "restored-cache"
          key: "compat-missing-${{ env.COMPAT_CACHE_KEY }}"
      - name: Assert documented effect
        env:
          HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          test "$HIT" != true
          echo compat:ok
