[package]
name = "codeyard-webui"
version.workspace = true
edition.workspace = true
description = "Codeyard Dioxus views: server rendering and browser hydration"
homepage = "https://codeyard.run"
repository = "https://github.com/blurskye/CodeYard"
license = "LGPL-3.0-or-later"

[features]
web = ["dep:dioxus-web", "dep:gloo-net", "dep:gloo-timers", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
codeyard-types.workspace = true
chrono.workspace = true
dioxus.workspace = true
dioxus-history.workspace = true
dioxus-router.workspace = true
futures-util.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
# Text revisions used by native forms must also be computed after hydration.
hex.workspace = true
sha2.workspace = true
syntect.workspace = true
unicase.workspace = true
unicode-normalization.workspace = true
url.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus-fullstack-core.workspace = true
dioxus-ssr.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-web = { workspace = true, optional = true }
gloo-net = { workspace = true, optional = true }
gloo-timers = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[lints]
workspace = true
